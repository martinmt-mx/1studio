<!DOCTYPE html>
<html lang="es" class="bg-zinc-950">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#09090b" />
  <title>1Studio · Tablero</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { -webkit-tap-highlight-color: transparent; }
    details > summary { list-style: none; }
    details > summary::-webkit-details-marker { display: none; }
    .tab-on { background: #fafafa; color: #09090b; }
    .ok-flash { background: #16a34a !important; color: #fff !important; border-color: #16a34a !important; }
  </style>
</head>
<body class="min-h-screen bg-zinc-950 text-zinc-100 antialiased">
  <header class="sticky top-0 z-30 border-b border-zinc-800 bg-zinc-950/90 backdrop-blur">
    <div class="mx-auto max-w-6xl px-4 pt-[max(env(safe-area-inset-top),0.75rem)] pb-3">
      <div class="flex items-center justify-between gap-3">
        <div class="flex items-center gap-2">
          <span id="live" class="h-2.5 w-2.5 rounded-full bg-zinc-600" title="Tiempo real"></span>
          <h1 class="text-lg font-bold tracking-tight">1Studio</h1>
        </div>
        <span id="encoder" class="rounded-full border border-zinc-700 px-2.5 py-1 text-xs text-zinc-400">…</span>
      </div>
      <nav class="mt-3 grid grid-cols-4 gap-1 rounded-xl bg-zinc-900 p-1 text-sm font-semibold">
        <button data-tab="gtavi" class="tab rounded-lg py-2">GTA VI</button>
        <button data-tab="largo" class="tab rounded-lg py-2">🎬 Largo</button>
        <button data-tab="ucronia" class="tab rounded-lg py-2">Historias</button>
        <button data-tab="metricas" class="tab rounded-lg py-2">Métricas</button>
      </nav>
    </div>
  </header>

  <main id="app" class="mx-auto max-w-6xl px-4 pb-24 pt-4"></main>

  <div id="toast" class="pointer-events-none fixed inset-x-0 bottom-[max(env(safe-area-inset-bottom),1rem)] z-50 flex justify-center px-4"></div>
  <script src="/app.js"></script>
  <script src="/editor.js"></script>
  <script src="/largo.js"></script>
</body>
</html>
